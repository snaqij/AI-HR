# Base role configuration
# All role configurations should inherit from this base config

version: "1.0"

role:
  id: "_base"
  family: "general"
  display_name:
    zh: "通用岗位"
    en: "General Role"

# Universal competencies (common to all roles)
universal_competencies:
  ownership:
    weight: 0.20
    description: "主人翁意识"
    evidence_types:
      - "initiative"
      - "responsibility"
      - "problem_solving"
  
  communication:
    weight: 0.15
    description: "沟通协作能力"
    evidence_types:
      - "clear_expression"
      - "active_listening"
      - "cross_team_collaboration"
  
  learning_agility:
    weight: 0.15
    description: "学习敏捷性"
    evidence_types:
      - "quick_learning"
      - "knowledge_transfer"
      - "continuous_improvement"
  
  result_orientation:
    weight: 0.25
    description: "结果导向"
    evidence_types:
      - "goal_achievement"
      - "impact_measurement"
      - "deadline_management"
  
  adaptability:
    weight: 0.25
    description: "适应能力"
    evidence_types:
      - "change_management"
      - "flexibility"
      - "resilience"

# Default stage weights
# Note: S1-S8 is the complete interview process, only main stage weights are configured here
stage_weights:
  S1: 0.10  # Opening icebreaker
  S2: 0.15  # Resume verification
  S3: 0.35  # Deep dive questioning
  S4: 0.30  # Competency assessment
  S5: 0.10  # Closing summary
  # S6: Comprehensive competency supplement (triggered as needed)
  # S7: Company introduction and Q&A (fixed process)
  # S8: Closing (fixed process)

# Question generation strategy
question_generation:
  distribution:
    from_resume: 0.60
    from_jd: 0.30
    from_template: 0.10
  
  anchor_project:
    required: true
    min_duration_months: 3

# Followup strategy
followup_strategy:
  max_per_question: 3
  evidence_threshold: 0.7
  priority:
    - "real_usage"
    - "technical_detail"
    - "problem_solving"
    - "impact"

# Prompt enhancements
prompt_enhancements:
  role_context: |
    这是一场通用岗位的面试。请根据候选人的背景和经历，
    评估其综合能力和潜力。
  
  question_focus: |
    题目应该围绕候选人的实际项目经历，
    关注其在项目中的角色、贡献和影响。
  
  followup_focus: |
    追问应该深入了解候选人的思考过程、
    解决问题的方法和实际成果。

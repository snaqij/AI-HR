# Backend engineer role configuration

version: "1.0"
extends: "_base"

role:
  id: "backend_engineer"
  family: "engineering"
  display_name:
    zh: "后端工程师"
    en: "Backend Engineer"
  
  match_rules:
    keywords:
      - "后端"
      - "backend"
      - "服务端"
      - "server"
      - "api"
    skills:
      - "java"
      - "python"
      - "go"
      - "spring"
      - "django"
      - "flask"
      - "mysql"
      - "redis"
      - "kafka"
      - "microservices"

# Role-specific competencies
role_competencies:
  technical_depth:
    weight: 0.30
    description: "技术深度"
    evidence_types:
      - "real_usage"
      - "technical_detail"
      - "architecture_design"
      - "performance_optimization"
  
  system_design:
    weight: 0.25
    description: "系统设计能力"
    evidence_types:
      - "scalability"
      - "reliability"
      - "maintainability"
      - "trade_off_analysis"
  
  code_quality:
    weight: 0.20
    description: "代码质量"
    evidence_types:
      - "clean_code"
      - "testing"
      - "code_review"
      - "refactoring"
  
  problem_solving:
    weight: 0.25
    description: "问题解决能力"
    evidence_types:
      - "debugging"
      - "root_cause_analysis"
      - "solution_design"
      - "incident_handling"

# Stage weights (override base configuration)
# Note: S1-S8 define the full interview flow; only major stages are weighted here.
# S6-S8 are triggered automatically based on interview progress.
stage_weights:
  S1: 0.05  # 开场破冰
  S2: 0.15  # 简历验证
  S3: 0.40  # 深度追问（技术岗位更重视）
  S4: 0.35  # 能力评估
  S5: 0.05  # 收尾总结
  # S6: Comprehensive capability supplement (triggered as needed)
  # S7: Company intro and candidate Q&A (fixed flow)
  # S8: Closing (fixed flow)

# Question generation strategy
question_generation:
  distribution:
    from_resume: 0.70  # 后端更关注实际项目经验
    from_jd: 0.20
    from_template: 0.10
  
  anchor_project:
    required: true
    min_duration_months: 6  # 后端项目通常周期较长

# Follow-up strategy
followup_strategy:
  max_per_question: 4  # 技术岗位可以追问更深
  evidence_threshold: 0.75
  priority:
    - "technical_detail"
    - "architecture_design"
    - "real_usage"
    - "problem_solving"
    - "performance_optimization"

# Prompt enhancements
prompt_enhancements:
  role_context: |
    候选人应聘后端工程师岗位。请重点评估其：
    1. 技术深度：对后端技术栈的掌握程度
    2. 系统设计：架构设计和系统优化能力
    3. 代码质量：编码规范和工程实践
    4. 问题解决：调试和故障排查能力
  
  question_focus: |
    题目应围绕候选人的后端项目经历，重点关注：
    - 使用的技术栈和框架
    - 系统架构和设计决策
    - 性能优化和问题解决
    - 代码质量和工程实践
  
  followup_focus: |
    追问应深入技术细节：
    - 具体的技术实现方案
    - 架构设计的权衡考虑
    - 遇到的技术难题和解决方法
    - 性能指标和优化效果

name: Bug Report
description: Report a reproducible bug
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please provide enough detail for us to reproduce.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A short and clear bug summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide exact reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste logs, tracebacks, or screenshots if available
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / Python / Node / browser version if applicable
      placeholder: e.g. Ubuntu 22.04, Python 3.11, Node 20

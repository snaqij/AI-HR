# 产品经理岗位配置

version: "1.0"
extends: "_base"

role:
  id: "product_manager"
  family: "product"
  display_name:
    zh: "产品经理"
    en: "Product Manager"
  
  match_rules:
    keywords:
      - "产品经理"
      - "product manager"
      - "pm"
      - "产品"
      - "product"
    skills:
      - "需求分析"
      - "产品设计"
      - "用户研究"
      - "数据分析"
      - "项目管理"
      - "axure"
      - "figma"
      - "sketch"

# 岗位特定能力
role_competencies:
  product_sense:
    weight: 0.30
    description: "产品sense"
    evidence_types:
      - "user_insight"
      - "market_analysis"
      - "product_vision"
      - "innovation"
  
  requirement_analysis:
    weight: 0.25
    description: "需求分析能力"
    evidence_types:
      - "user_research"
      - "requirement_prioritization"
      - "feature_definition"
      - "acceptance_criteria"
  
  execution_ability:
    weight: 0.25
    description: "执行落地能力"
    evidence_types:
      - "project_management"
      - "cross_team_collaboration"
      - "milestone_delivery"
      - "risk_management"
  
  data_driven:
    weight: 0.20
    description: "数据驱动"
    evidence_types:
      - "metrics_definition"
      - "data_analysis"
      - "ab_testing"
      - "iteration_optimization"

# 阶段权重
stage_weights:
  S1: 0.05
  S2: 0.20
  S3: 0.35
  S4: 0.35
  S5: 0.05
  # S6-S8: 按需触发或固定流程

# 题目生成策略
question_generation:
  distribution:
    from_resume: 0.60
    from_jd: 0.30
    from_template: 0.10
  
  anchor_project:
    required: true
    min_duration_months: 3

# 追问策略
followup_strategy:
  max_per_question: 3
  evidence_threshold: 0.70
  priority:
    - "user_insight"
    - "requirement_analysis"
    - "execution_ability"
    - "data_driven"

# Prompt增强
prompt_enhancements:
  role_context: |
    候选人应聘产品经理岗位。请重点评估其：
    1. 产品sense：用户洞察和产品愿景能力
    2. 需求分析：用户研究和需求优先级判断能力
    3. 执行落地：项目管理和跨团队协作能力
    4. 数据驱动：指标定义和数据分析能力
  
  question_focus: |
    题目应围绕候选人的产品项目经历，重点关注：
    - 产品从0到1的过程
    - 用户需求的发现和分析
    - 产品功能的设计和优先级
    - 项目推进和团队协作
    - 数据指标和迭代优化
  
  followup_focus: |
    追问应深入产品思维和方法论：
    - 如何发现和验证用户需求
    - 如何做产品决策和权衡
    - 如何推动项目落地
    - 如何通过数据驱动迭代

# 前端工程师岗位配置

version: "1.0"
extends: "_base"

role:
  id: "frontend_engineer"
  family: "engineering"
  display_name:
    zh: "前端工程师"
    en: "Frontend Engineer"
  
  match_rules:
    keywords:
      - "前端"
      - "frontend"
      - "web"
      - "h5"
      - "移动端"
    skills:
      - "javascript"
      - "typescript"
      - "react"
      - "vue"
      - "angular"
      - "html"
      - "css"
      - "webpack"
      - "vite"

# 岗位特定能力
role_competencies:
  ui_implementation:
    weight: 0.30
    description: "UI实现能力"
    evidence_types:
      - "component_design"
      - "responsive_design"
      - "cross_browser_compatibility"
      - "accessibility"
  
  frontend_architecture:
    weight: 0.25
    description: "前端架构能力"
    evidence_types:
      - "state_management"
      - "routing"
      - "code_splitting"
      - "performance_optimization"
  
  user_experience:
    weight: 0.20
    description: "用户体验"
    evidence_types:
      - "interaction_design"
      - "animation"
      - "loading_optimization"
      - "error_handling"
  
  engineering_practice:
    weight: 0.25
    description: "工程化实践"
    evidence_types:
      - "build_tools"
      - "testing"
      - "ci_cd"
      - "code_quality"

# 阶段权重
# 注意：S1-S8是完整的面试流程，这里只配置主要阶段的权重
stage_weights:
  S1: 0.05
  S2: 0.15
  S3: 0.40
  S4: 0.35
  S5: 0.05
  # S6-S8: 按需触发或固定流程

# 题目生成策略
question_generation:
  distribution:
    from_resume: 0.65
    from_jd: 0.25
    from_template: 0.10
  
  anchor_project:
    required: true
    min_duration_months: 4

# 追问策略
followup_strategy:
  max_per_question: 4
  evidence_threshold: 0.75
  priority:
    - "component_design"
    - "performance_optimization"
    - "user_experience"
    - "engineering_practice"

# Prompt增强
prompt_enhancements:
  role_context: |
    候选人应聘前端工程师岗位。请重点评估其：
    1. UI实现：组件设计和响应式布局能力
    2. 前端架构：状态管理和性能优化能力
    3. 用户体验：交互设计和体验优化能力
    4. 工程化：构建工具和工程实践能力
  
  question_focus: |
    题目应围绕候选人的前端项目经历，重点关注：
    - 使用的前端框架和技术栈
    - 组件设计和状态管理方案
    - 性能优化和用户体验提升
    - 工程化实践和构建流程
  
  followup_focus: |
    追问应深入前端技术细节：
    - 具体的组件实现方案
    - 性能优化的具体措施
    - 用户体验的改进方法
    - 工程化工具的使用经验

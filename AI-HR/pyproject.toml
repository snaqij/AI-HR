[project]
name = "ai-hr"
version = "0.1.0"
description = "AI-HR backend service built with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.1",
    "websockets>=12.0",
    "redis>=5.0.0",
    "dashscope>=1.25.15",
    "alibabacloud-nls-python-sdk>=1.0.2",
    "aliyun-python-sdk-core>=2.16.0",
    "httpx>=0.27.0",
    "agora-token-builder>=1.0.0",
    "pypdf>=4.3.1",
    "cryptography>=42.0.0",
    "minio>=7.2.9",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[project.scripts]
ai-hr-api = "ai_hr.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_hr"]

[tool.ruff]
target-version = "py310"
line-length = 140
